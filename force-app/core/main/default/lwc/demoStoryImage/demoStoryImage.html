<template>
    <div class="img-field">
        <label class="img-label">{label}</label>
        <div class="img-row">
            <div class="img-thumb">
                <template lwc:if={hasValue}>
                    <img src={value} alt={label} />
                </template>
                <template lwc:else>
                    <span class="img-empty">No image</span>
                </template>
            </div>
            <div class="img-controls">
                <lightning-input variant="label-hidden" placeholder="Paste an image URL"
                    value={value} onchange={handleUrl}></lightning-input>
                <label class="img-upload-btn">
                    <span>{uploadLabel}</span>
                    <input type="file" accept="image/*" onchange={handleFile} class="img-file-input" />
                </label>
                <div class="img-btns">
                    <template lwc:if={hasLibrary}>
                        <lightning-button label={toggleLabel} onclick={toggleGrid} variant="neutral"></lightning-button>
                    </template>
                    <template lwc:if={hasValue}>
                        <lightning-button label="Clear" onclick={clearImg} variant="base"></lightning-button>
                    </template>
                </div>
            </div>
        </div>
        <template lwc:if={showGrid}>
            <template lwc:if={hasSearch}>
                <lightning-input type="search" variant="label-hidden"
                    placeholder="Search the library (e.g. jacket, tent, serum)…"
                    value={query} onchange={handleSearch} class="img-search"></lightning-input>
            </template>
            <div class="img-grid">
                <template for:each={filteredImages} for:item="img">
                    <button key={img.id} class="img-cell" data-url={img.url}
                        title={img.description} onclick={pickFromGrid}>
                        <img src={img.url} alt={img.description} loading="lazy" />
                    </button>
                </template>
            </div>
            <template lwc:if={noMatches}>
                <p class="img-nomatch">No images match “{query}”.</p>
            </template>
        </template>
    </div>
</template>
