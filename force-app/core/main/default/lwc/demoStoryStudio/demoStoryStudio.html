<template>
    <div class="studio-frame" style={frameStyle}>
        <header class="studio-toolbar">
            <div class="studio-toolbar-left">
                <span class="studio-logo">
                    <lightning-icon icon-name={channelIcon} size="small" variant="inverse"></lightning-icon>
                </span>
                <div class="studio-title-wrap">
                    <h1 class="studio-title">Story Studio</h1>
                    <p class="studio-subtitle">{subtitle}</p>
                </div>
            </div>
            <div class="studio-toolbar-right">
                <span class={saveStatusPillClass}>
                    <span class="save-status-text">{saveStatusText}</span>
                </span>
                <lightning-button variant="neutral" label="Download HTML" icon-name="utility:download"
                    onclick={handleDownload} disabled={loading} class="slds-m-left_small"></lightning-button>
                <lightning-button variant="brand" label="Save" onclick={handleSave} disabled={loading}
                    class="slds-m-left_x-small"></lightning-button>
                <template lwc:if={isEmail}>
                    <lightning-button variant="brand" label="Push to Marketing Cloud" icon-name="utility:send"
                        onclick={openMcaPush} disabled={loading} class="slds-m-left_x-small"></lightning-button>
                </template>
            </div>
        </header>

        <div class="generate-banner">
            <div class="generate-banner-body">
                <span class="generate-banner-icon">
                    <lightning-icon icon-name="utility:magicwand" size="small" variant="inverse"></lightning-icon>
                </span>
                <div class="generate-banner-text">
                    <h3 class="generate-banner-title">Start with a story, not a form</h3>
                    <p class="generate-banner-sub">Describe the brand and offer — we'll pre-fill the branded experience and the 2-way agent conversation. Then edit anything, with the preview updating live.</p>
                </div>
            </div>
            <lightning-button variant="brand" label="✨ Generate" icon-name="utility:magicwand"
                onclick={handleGenerate} class="generate-banner-btn"></lightning-button>
        </div>

        <div class="studio-split" style={splitStyle}>
            <nav class="studio-rail">
                <template for:each={tabs} for:item="t">
                    <button key={t.key} class={t.className} data-key={t.key} onclick={handleTab}>
                        <lightning-icon icon-name={t.icon} size="x-small" class="rail-icon"></lightning-icon>
                        <span class="rail-label">{t.label}</span>
                    </button>
                </template>
                <div class="rail-credit">Built by Monica Toledo</div>
            </nav>

            <section class="studio-editor">
                <template lwc:if={isBranding}>
                    <h2 class="sec-title">Branding</h2>
                    <p class="sec-subtitle">Brand Kit — applies colors, logo &amp; sender avatar (override anything below)</p>
                    <div class="brand-current">
                        <template lwc:if={selectedKit}>
                            <span class="kit-swatch kit-swatch--sm" style={selectedKit.swatch}>
                                <template lwc:if={selectedKit.hasLogo}><img src={selectedKit.logo} alt={selectedKit.label} /></template>
                            </span>
                            <span class="brand-current-name">{selectedKit.label}</span>
                        </template>
                        <lightning-button variant="base" label={brandChangeLabel} onclick={toggleBrandPicker}></lightning-button>
                    </div>
                    <template lwc:if={showBrandPicker}>
                        <lightning-input type="search" variant="label-hidden" placeholder="Search brands…"
                            value={brandSearch} onchange={handleBrandSearch} class="slds-m-vertical_x-small"></lightning-input>
                        <div class="kit-grid">
                            <template for:each={filteredBrandTiles} for:item="k">
                                <button key={k.id} class={k.cls} data-kitid={k.id} onclick={handlePickKit} title={k.label}>
                                    <span class="kit-swatch" style={k.swatch}>
                                        <template lwc:if={k.hasLogo}><img src={k.logo} alt={k.label} /></template>
                                    </span>
                                    <span class="kit-name">{k.label}</span>
                                </button>
                            </template>
                        </div>
                    </template>
                    <lightning-input label="Brand Name" data-field="brandName" value={config.brandName} onchange={handleInput}></lightning-input>
                    <lightning-input label="Brand Domain" data-field="brandDomain" value={config.brandDomain} onchange={handleInput}></lightning-input>
                    <template lwc:if={isMessaging}>
                        <c-demo-story-image label="Primary Logo (banner / card art)" kind="logo" value={config.logoUrl} data-field="logoUrl" onpick={handleImagePick}></c-demo-story-image>
                        <c-demo-story-image label="Secondary Logo (chat avatar — fits a circle)" kind="avatar" value={config.marketingAvatarUrl} data-field="marketingAvatarUrl" onpick={handleImagePick}></c-demo-story-image>
                    </template>
                    <template lwc:if={isEmail}>
                        <c-demo-story-image label="Marketing Sender Avatar" kind="avatar" value={config.marketingAvatarUrl} data-field="marketingAvatarUrl" onpick={handleImagePick}></c-demo-story-image>
                        <c-demo-story-image label="Logo" kind="logo" value={config.logoUrl} data-field="logoUrl" onpick={handleImagePick}></c-demo-story-image>
                        <lightning-input type="number" label="Logo Width (px)" data-field="logoWidth" value={config.logoWidth} onchange={handleInput}></lightning-input>
                        <div class="color-field"><label class="color-label">Logo Background Color</label><div class="color-row"><input type="color" class="color-swatch" data-field="logoBgColor" value={config.logoBgColor} onchange={handleInput} /><lightning-input variant="label-hidden" data-field="logoBgColor" value={config.logoBgColor} onchange={handleInput}></lightning-input></div></div>
                    </template>
                    <div class="color-field"><label class="color-label">Primary Hex Color</label><div class="color-row"><input type="color" class="color-swatch" data-field="primaryColor" value={config.primaryColor} onchange={handleInput} /><lightning-input variant="label-hidden" data-field="primaryColor" value={config.primaryColor} onchange={handleInput}></lightning-input></div></div>
                    <template lwc:if={isEmail}>
                        <div class="color-field"><label class="color-label">Headline Text Color</label><div class="color-row"><input type="color" class="color-swatch" data-field="headlineTextColor" value={config.headlineTextColor} onchange={handleInput} /><lightning-input variant="label-hidden" data-field="headlineTextColor" value={config.headlineTextColor} onchange={handleInput}></lightning-input></div></div>
                    </template>
                    <template lwc:if={isMessaging}>
                        <lightning-combobox label="Phone Theme" data-field="theme" value={config.theme}
                            options={themeOptions} onchange={handleDetailField}
                            field-level-help="Light or dark mode for the simulated phone screen."></lightning-combobox>
                    </template>
                    <template lwc:if={isRcs}>
                        <lightning-combobox label="Device" data-field="device" value={config.device}
                            options={deviceOptions} onchange={handleDetailField}
                            field-level-help="Android (Google Messages) or iPhone chrome for the RCS preview."></lightning-combobox>
                    </template>
                </template>

                <template lwc:if={isTemplate}>
                    <h2 class="sec-title">Email Template</h2>
                    <lightning-input label="Email Subject Line" data-field="subjectLine" value={config.subjectLine} onchange={handleInput}></lightning-input>
                    <c-demo-story-image label="Hero Image" value={config.heroImageUrl} data-field="heroImageUrl" onpick={handleImagePick}></c-demo-story-image>
                    <lightning-input label="Headline" data-field="headline" value={config.headline} onchange={handleInput}></lightning-input>
                    <lightning-input label="Sub-headline" data-field="subHeadline" value={config.subHeadline} onchange={handleInput}></lightning-input>
                    <lightning-textarea label="2-Column Copy: Left" data-field="featureColumn1" value={config.featureColumn1} onchange={handleInput}></lightning-textarea>
                    <lightning-textarea label="2-Column Copy: Right" data-field="featureColumn2" value={config.featureColumn2} onchange={handleInput}></lightning-textarea>
                    <div class="color-field"><label class="color-label">2-Column Text Color</label><div class="color-row"><input type="color" class="color-swatch" data-field="featureColumnTextColor" value={config.featureColumnTextColor} onchange={handleInput} /><lightning-input variant="label-hidden" data-field="featureColumnTextColor" value={config.featureColumnTextColor} onchange={handleInput}></lightning-input></div></div>
                    <div class="color-field"><label class="color-label">2-Column Section Background Color</label><div class="color-row"><input type="color" class="color-swatch" data-field="featureSectionColor" value={config.featureSectionColor} onchange={handleInput} /><lightning-input variant="label-hidden" data-field="featureSectionColor" value={config.featureSectionColor} onchange={handleInput}></lightning-input></div></div>
                    <lightning-textarea label="Body" data-field="bodyParagraph" value={config.bodyParagraph} onchange={handleInput}></lightning-textarea>
                    <lightning-input type="checkbox" label="Show bullet points" data-field="showBullets" checked={config.showBullets} onchange={handleToggle}></lightning-input>
                    <lightning-input label="Bullet Point 1" data-field="bullet1" value={config.bullet1} onchange={handleInput}></lightning-input>
                    <lightning-input label="Bullet Point 2" data-field="bullet2" value={config.bullet2} onchange={handleInput}></lightning-input>
                    <lightning-input label="Bullet Point 3" data-field="bullet3" value={config.bullet3} onchange={handleInput}></lightning-input>
                    <lightning-input label="Reply Prompt Headline" data-field="replyPromptHeadline" value={config.replyPromptHeadline} onchange={handleInput}></lightning-input>
                    <lightning-textarea label="Reply Prompt Body" data-field="replyPromptBody" value={config.replyPromptBody} onchange={handleInput}></lightning-textarea>
                    <lightning-input label="CTA Button Text" data-field="ctaButtonText" value={config.ctaButtonText} onchange={handleInput}></lightning-input>
                    <div class="color-field"><label class="color-label">CTA Button Color</label><div class="color-row"><input type="color" class="color-swatch" data-field="ctaButtonColor" value={config.ctaButtonColor} onchange={handleInput} /><lightning-input variant="label-hidden" data-field="ctaButtonColor" value={config.ctaButtonColor} onchange={handleInput}></lightning-input></div></div>
                </template>

                <template lwc:if={isCustomer}>
                    <h2 class="sec-title">Customer Profile</h2>
                    <lightning-input type="search" label="Inherit from Persona" placeholder="Search personas…"
                        value={personaSearch} onchange={handlePersonaSearch}></lightning-input>
                    <lightning-combobox variant="label-hidden" placeholder="Select a persona…"
                        options={filteredPersonaOptions} value={config.personaId} onchange={handlePersona}></lightning-combobox>
                    <p class="sec-subtitle">Fills the recipient identity from the Demo Persona. Override below.</p>
                    <lightning-input label="Customer Name" data-field="customerName" value={config.customerName} onchange={handleInput}></lightning-input>
                    <!-- These fields only render in the Email sim; the phone sims show just the name. -->
                    <template lwc:if={isEmail}>
                        <lightning-input label="Customer Email" data-field="customerEmail" value={config.customerEmail} onchange={handleInput}></lightning-input>
                        <c-demo-story-image label="Customer Avatar" kind="avatar" value={config.customerAvatarUrl} data-field="customerAvatarUrl" onpick={handleImagePick}></c-demo-story-image>
                        <lightning-input label="Customer Title" data-field="customerTitle" value={config.customerTitle} onchange={handleInput}></lightning-input>
                        <lightning-input label="Customer Company" data-field="customerCompany" value={config.customerCompany} onchange={handleInput}></lightning-input>
                        <lightning-input label="Customer Mobile" data-field="customerMobile" value={config.customerMobile} onchange={handleInput}></lightning-input>
                        <lightning-input label="Address" data-field="address" value={config.address} onchange={handleInput}></lightning-input>
                    </template>
                </template>

                <template lwc:if={isAgent}>
                    <h2 class="sec-title">AI Agent</h2>
                    <lightning-input label="Virtual Agent Name" data-field="agentName" value={config.agentName} onchange={handleInput}></lightning-input>
                    <c-demo-story-image label="Agent Avatar" kind="avatar" value={config.agentAvatarUrl} data-field="agentAvatarUrl" onpick={handleImagePick}></c-demo-story-image>
                </template>

                <template lwc:if={isConvo}>
                    <h2 class="sec-title">Customer &amp; Agent Messages</h2>
                    <template lwc:if={isMessaging}>
                        <p class="sec-subtitle">AI agent identity — shown in the chat header; the agent's replies are its side of the thread below.</p>
                        <lightning-input label="Virtual Agent Name" data-field="agentName" value={config.agentName} onchange={handleInput}></lightning-input>
                        <c-demo-story-image label="Agent Avatar" kind="avatar" value={config.agentAvatarUrl} data-field="agentAvatarUrl" onpick={handleImagePick}></c-demo-story-image>
                        <lightning-input label="Chat Header Title" data-field="messagingAgentHeader" value={config.messagingAgentHeader} onchange={handleInput}
                            placeholder="Penny (Cumulus Financial AI Agent)"
                            field-level-help="Shown at the top of the chat. Leave blank to auto-build from the agent + brand name. The chat header photo uses this Agent Avatar (falls back to the Marketing Sender Avatar)."></lightning-input>
                    </template>
                    <p class="sec-subtitle">Thread — the back-and-forth 2-way conversation</p>
                    <template for:each={decoratedMessages} for:item="m">
                        <!-- RCS authoring row (EG parity): toned badge + type / sender / typing / delete -->
                        <template lwc:if={m.rcs}>
                            <div key={m.i} class="rcs-row-card" style={m.rowStyle}>
                                <div class="rcs-row-top">
                                    <span class="rcs-row-badge" style={m.badgeStyle}>{m.rowLabel}</span>
                                    <lightning-combobox variant="label-hidden" class="rcs-type-pick"
                                        data-i={m.i} value={m.rcsType} options={rcsTypeOptions}
                                        onchange={handleRcsType}></lightning-combobox>
                                    <lightning-combobox variant="label-hidden" class="rcs-sender-pick"
                                        data-i={m.i} value={m.sender} options={senderOptions}
                                        onchange={handleSender}></lightning-combobox>
                                    <lightning-combobox variant="label-hidden" class="rcs-typing-pick"
                                        data-i={m.i} value={m.typingDuration} options={rcsTypingOptions}
                                        onchange={handleTyping}></lightning-combobox>
                                    <button class="rcs-row-del" data-i={m.i} onclick={removeMessage}>Delete</button>
                                </div>
                                <template lwc:if={m.triggeredByLabel}>
                                    <div class="rcs-pair-banner rcs-pair-in">↩ Triggered by tap on <strong>{m.triggeredByLabel}</strong></div>
                                </template>
                                <p class="rcs-row-help">{m.help}</p>
                                <!-- Text / Text + quick replies -->
                                <template lwc:if={m.isText}>
                                    <lightning-textarea label="Message" data-i={m.i} value={m.text} onchange={handleMsg}></lightning-textarea>
                                </template>
                                <template lwc:if={m.isQuickReplies}>
                                    <lightning-textarea label="Anchor message" data-i={m.i} value={m.text} onchange={handleMsg}></lightning-textarea>
                                    <p class="rcs-list-label">Chips (up to 11)</p>
                                    <template for:each={m.chipRows} for:item="ch">
                                        <div key={ch.ci} class="rcs-chip-edit">
                                            <lightning-input label="Chip label" data-i={m.i} data-c={ch.ci} data-list="chips" value={ch.label} onchange={handleActionLabel}></lightning-input>
                                            <lightning-combobox label="On tap, do" data-i={m.i} data-c={ch.ci} data-list="chips" value={ch.action} options={rcsActionOptions} onchange={handleActionType}></lightning-combobox>
                                            <template lwc:if={ch.showTarget}>
                                                <lightning-input label={ch.targetLabel} data-i={m.i} data-c={ch.ci} data-list="chips" value={ch.target} onchange={handleActionTarget}></lightning-input>
                                            </template>
                                            <template lwc:if={ch.isQuickReply}>
                                                <lightning-combobox label="Brand response when this chip is tapped" data-i={m.i} data-c={ch.ci} data-list="chips" value={ch.responseType} options={rcsResponseOptions} onchange={handleActionResponse}></lightning-combobox>
                                                <template lwc:if={ch.triggersCard}><div class="rcs-pair-banner rcs-pair-out">↗ Triggers a new rich card message inserted right after this one.</div></template>
                                                <template lwc:if={ch.showRespText}><lightning-textarea label="Reply text" data-i={m.i} data-c={ch.ci} data-list="chips" value={ch.response} onchange={handleActionText}></lightning-textarea></template>
                                            </template>
                                            <lightning-button variant="base" label="Remove chip" data-i={m.i} data-c={ch.ci} onclick={removeChip}></lightning-button>
                                        </div>
                                    </template>
                                    <lightning-button label="+ Add chip" data-i={m.i} onclick={addChip} class="slds-m-top_x-small"></lightning-button>
                                </template>
                                <!-- Suggested actions (chips only) -->
                                <template lwc:if={m.isSuggested}>
                                    <p class="rcs-list-label">Chips (up to 11)</p>
                                    <template for:each={m.chipRows} for:item="ch">
                                        <div key={ch.ci} class="rcs-chip-edit">
                                            <lightning-input label="Chip label" data-i={m.i} data-c={ch.ci} data-list="chips" value={ch.label} onchange={handleActionLabel}></lightning-input>
                                            <lightning-combobox label="On tap, do" data-i={m.i} data-c={ch.ci} data-list="chips" value={ch.action} options={rcsActionOptions} onchange={handleActionType}></lightning-combobox>
                                            <template lwc:if={ch.showTarget}>
                                                <lightning-input label={ch.targetLabel} data-i={m.i} data-c={ch.ci} data-list="chips" value={ch.target} onchange={handleActionTarget}></lightning-input>
                                            </template>
                                            <template lwc:if={ch.isQuickReply}>
                                                <lightning-combobox label="Brand response when this chip is tapped" data-i={m.i} data-c={ch.ci} data-list="chips" value={ch.responseType} options={rcsResponseOptions} onchange={handleActionResponse}></lightning-combobox>
                                                <template lwc:if={ch.triggersCard}><div class="rcs-pair-banner rcs-pair-out">↗ Triggers a new rich card message inserted right after this one.</div></template>
                                                <template lwc:if={ch.showRespText}><lightning-textarea label="Reply text" data-i={m.i} data-c={ch.ci} data-list="chips" value={ch.response} onchange={handleActionText}></lightning-textarea></template>
                                            </template>
                                            <lightning-button variant="base" label="Remove chip" data-i={m.i} data-c={ch.ci} onclick={removeChip}></lightning-button>
                                        </div>
                                    </template>
                                    <lightning-button label="+ Add chip" data-i={m.i} onclick={addChip} class="slds-m-top_x-small"></lightning-button>
                                </template>
                                <!-- Rich card (vertical / horizontal) -->
                                <template lwc:if={m.isCard}>
                                    <c-demo-story-image label="Card image" value={m.cardMedia} data-i={m.i} onpick={handleCardImage}></c-demo-story-image>
                                    <lightning-input label="Card title" data-i={m.i} data-field="title" value={m.cardTitle} onchange={handleCardText}></lightning-input>
                                    <lightning-input label="Card description" data-i={m.i} data-field="description" value={m.cardDesc} onchange={handleCardText}></lightning-input>
                                    <p class="rcs-list-label">Card buttons (up to 4)</p>
                                    <template for:each={m.buttonRows} for:item="bt">
                                        <div key={bt.ci} class="rcs-chip-edit">
                                            <lightning-input label="Button label" data-i={m.i} data-c={bt.ci} data-list="buttons" value={bt.label} onchange={handleActionLabel}></lightning-input>
                                            <lightning-combobox label="On tap, do" data-i={m.i} data-c={bt.ci} data-list="buttons" value={bt.action} options={rcsActionOptions} onchange={handleActionType}></lightning-combobox>
                                            <template lwc:if={bt.showTarget}>
                                                <lightning-input label={bt.targetLabel} data-i={m.i} data-c={bt.ci} data-list="buttons" value={bt.target} onchange={handleActionTarget}></lightning-input>
                                            </template>
                                            <template lwc:if={bt.isQuickReply}>
                                                <lightning-combobox label="Brand response when this button is tapped" data-i={m.i} data-c={bt.ci} data-list="buttons" value={bt.responseType} options={rcsResponseOptions} onchange={handleActionResponse}></lightning-combobox>
                                                <template lwc:if={bt.triggersCard}><div class="rcs-pair-banner rcs-pair-out">↗ Triggers a new rich card message inserted right after this one.</div></template>
                                                <template lwc:if={bt.showRespText}><lightning-textarea label="Reply text" data-i={m.i} data-c={bt.ci} data-list="buttons" value={bt.response} onchange={handleActionText}></lightning-textarea></template>
                                            </template>
                                            <lightning-button variant="base" label="Remove button" data-i={m.i} data-c={bt.ci} onclick={removeButton}></lightning-button>
                                        </div>
                                    </template>
                                    <lightning-button label="+ Add button" data-i={m.i} onclick={addButton} class="slds-m-top_x-small"></lightning-button>
                                </template>
                                <!-- Card carousel -->
                                <template lwc:if={m.isCarousel}>
                                    <p class="rcs-row-help">Carousel editing is coming — seed/Generate produces cards; use Rich card for single cards for now.</p>
                                </template>
                                <template lwc:if={m.showRcsImage}>
                                    <c-demo-story-image label="Attach image (optional)" value={m.imageUrl} data-i={m.i} onpick={handleMsgImage}></c-demo-story-image>
                                </template>
                                <template lwc:if={m.triggersRichCard}>
                                    <div class="rcs-pair-banner rcs-pair-out">↗ Triggers a new rich card message inserted right after this one.</div>
                                </template>
                            </div>
                        </template>
                        <!-- Simple row for Email / SMS / WhatsApp -->
                        <template lwc:if={m.showSimple}>
                            <div key={m.i} class="msg-row">
                                <div class="msg-row-head">
                                    <lightning-combobox class="msg-sender" variant="label-hidden"
                                        data-i={m.i} value={m.sender} options={senderOptions}
                                        onchange={handleSender}></lightning-combobox>
                                    <lightning-button-icon icon-name="utility:delete" variant="border-filled"
                                        alternative-text="Delete message" title="Delete message"
                                        data-i={m.i} onclick={removeMessage}></lightning-button-icon>
                                </div>
                                <lightning-textarea label={m.rowLabel} variant="label-hidden"
                                    data-i={m.i} value={m.text} onchange={handleMsg}></lightning-textarea>
                                <template lwc:if={isMessaging}>
                                    <c-demo-story-image label="Attach image (optional)" value={m.imageUrl}
                                        data-i={m.i} onpick={handleMsgImage}></c-demo-story-image>
                                </template>
                            </div>
                        </template>
                    </template>
                    <lightning-button label="+ Add Message" onclick={addMessage}
                        class="slds-m-top_x-small"></lightning-button>
                </template>
            </section>

            <div class="studio-resizer" onmousedown={startResize} title="Drag to resize"></div>

            <aside class="studio-preview">
                <header class="preview-header">
                    <lightning-icon icon-name="utility:preview" size="x-small"></lightning-icon>
                    <span>{previewLabel}</span>
                    <lightning-button-icon icon-name="utility:refresh" variant="border-filled"
                        alternative-text="Restart simulation" title="Restart the 2-way simulation"
                        onclick={handleResetPreview} class="preview-reset"></lightning-button-icon>
                </header>
                <div class="preview-canvas">
                    <iframe class="preview-iframe" title="2-Way preview" src={previewUrl}></iframe>
                </div>
            </aside>
        </div>

        <template lwc:if={showGenerate}>
            <section class="gen-backdrop" onclick={closeGenerate}></section>
            <section class="gen-modal">
                <header class="gen-header">
                    <span class="gen-header-icon">
                        <lightning-icon icon-name="utility:einstein" variant="inverse" size="small"></lightning-icon>
                    </span>
                    <div class="gen-header-text">
                        <h3 class="gen-header-title">{genModalTitle}</h3>
                        <p class="gen-header-sub">{genModalSub}</p>
                    </div>
                    <lightning-button-icon icon-name="utility:close" variant="bare-inverse" alternative-text="Close"
                        class="gen-close" onclick={closeGenerate}></lightning-button-icon>
                </header>
                <div class="gen-body">
                    <div class="gen-ctx-head">
                        <label class="gen-label">Campaign context</label>
                        <button class="gen-prepare" onclick={toggleCopyPrompt}>? How to prepare this</button>
                    </div>
                    <p class="gen-help">The offer, the audience, and the angle you want to demo. The more specific, the better the draft — Einstein also uses the Brand Kit and Persona you've set.</p>
                    <template lwc:if={showCopyPrompt}>
                        <div class="gen-copy-callout">
                            <p class="gen-copy-callout-label">Copy this into Granola / Notebook LM / Gemini / ChatGPT / Slack AI, then paste the paragraph it returns into the box below:</p>
                            <pre class="gen-copy-pre">{copyablePrompt}</pre>
                            <lightning-button label="Copy prompt" icon-name="utility:copy"
                                onclick={handleCopyPrompt} class="slds-m-top_x-small"></lightning-button>
                        </div>
                    </template>
                    <lightning-textarea variant="label-hidden" value={genContext} onchange={handleGenContext}
                        class="gen-context"
                        placeholder="Example: Win back lapsed auto-loan shoppers. Rates just dropped 75bps; target members who started an application in the last 90 days but didn't finish. Angle: a time-boxed rate-lock with a nudge to reply for help."></lightning-textarea>
                    <div class="gen-row">
                        <lightning-combobox label="Industry" options={industryOptions} value={genIndustry} onchange={handleGenIndustry}></lightning-combobox>
                        <lightning-combobox label="Angle (optional)" options={angleOptions} value={genAngle} onchange={handleGenAngle} placeholder="Choose an angle…"></lightning-combobox>
                    </div>
                    <p class="gen-hint">Brand: <strong>{config.brandName}</strong> · change it by picking a Brand Kit in Branding.</p>
                </div>
                <footer class="gen-footer">
                    <template lwc:if={generating}>
                        <lightning-spinner alternative-text="Generating..." size="small"></lightning-spinner>
                    </template>
                    <lightning-button label="Cancel" onclick={closeGenerate} disabled={generating}></lightning-button>
                    <lightning-button variant="brand" label="✨ Generate" onclick={runGenerate} disabled={generating}
                        class="slds-m-left_x-small"></lightning-button>
                </footer>
            </section>
        </template>

        <template lwc:if={showMcaPush}>
            <section class="gen-backdrop" onclick={closeMcaPush}></section>
            <section class="gen-modal">
                <header class="gen-header">
                    <span class="gen-header-icon">
                        <lightning-icon icon-name="utility:send" variant="inverse" size="small"></lightning-icon>
                    </span>
                    <div class="gen-header-text">
                        <h3 class="gen-header-title">Deploy to Marketing Cloud</h3>
                        <p class="gen-header-sub">Create this email as a real Marketing Cloud Advanced email asset.</p>
                    </div>
                    <lightning-button-icon icon-name="utility:close" variant="bare-inverse" alternative-text="Close"
                        class="gen-close" onclick={closeMcaPush}></lightning-button-icon>
                </header>
                <div class="gen-body">
                    <lightning-input type="search" label="Workspace" placeholder="Search workspaces…"
                        value={mcaWorkspaceSearch} onchange={handleMcaWorkspaceSearch}></lightning-input>
                    <lightning-combobox variant="label-hidden" options={filteredMcaWorkspaces} value={mcaWorkspaceId}
                        onchange={handleMcaWorkspace} placeholder="Choose a workspace…" class="slds-m-top_xx-small"></lightning-combobox>
                    <p class="gen-hint">Lands in the chosen content workspace (remembers your last pick). The hero comes through as a Dynamic-Content-ready image component.</p>
                    <template lwc:if={mcaResultUrl}>
                        <div class="gen-copy-callout">
                            <p class="gen-copy-callout-label">Deployed! Open it in Marketing Cloud:</p>
                            <lightning-button label="Open email" icon-name="utility:new_window"
                                onclick={openMcaResult} class="slds-m-top_x-small"></lightning-button>
                        </div>
                    </template>
                </div>
                <footer class="gen-footer">
                    <template lwc:if={mcaPushing}>
                        <lightning-spinner alternative-text="Deploying..." size="small"></lightning-spinner>
                    </template>
                    <lightning-button label="Close" onclick={closeMcaPush} disabled={mcaPushing}></lightning-button>
                    <lightning-button variant="brand" label="Deploy email" onclick={runMcaPush} disabled={mcaPushing}
                        class="slds-m-left_x-small"></lightning-button>
                </footer>
            </section>
        </template>
    </div>
</template>
